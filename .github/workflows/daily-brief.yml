name: Daily Brief Publisher

on:
  schedule:
    - cron: '0 11 * * *' # 6:00 AM US Central Time (UTC-5 during daylight saving)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily brief
        run: node scripts/generate-daily-brief.mjs

      - name: Build site
        run: npm run build

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/pages/blog
          git commit -m "Update daily brief automation for $(date -u +%F)" || echo "No changes to commit"
          git push
          # Note: The push to main triggers deploy-pages.yml workflow
          # which handles building and updating the gh-pages branch for live deployment

# Trigger deploy
