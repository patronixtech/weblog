name: Daily Brief Publisher

on:
  schedule:
    - cron: '7 11 * * *' # 6:07 AM US Central Time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily brief
        run: node scripts/generate-daily-brief.mjs

      - name: Build site
        run: npm run build

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add .
          
          if ! git diff --cached --quiet; then
            git commit -m "Update daily brief automation for $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new daily brief changes to commit."
          fi
