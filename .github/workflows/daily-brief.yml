name: Daily Brief Publisher

on:
  schedule:
    - cron: '7 11 * * *' # 6:00 AM US Central Time (UTC-5 during daylight saving)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily brief
        run: node scripts/generate-daily-brief.mjs

      - name: Build site
        run: npm run build

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update daily brief automation for $(date +'%Y-%m-%d')"
          
          # Fetch remote changes and rebase your new commit on top of them
          git pull --rebase origin main
          
          git push origin main

      - name: Trigger Deployment Workflow
        run: |
          curl -X POST -H "Authorization: token ${{ secrets.DEPLOY_TOKEN }}" \
               -H "Accept: application/vnd.github+json" \
               https://github.com{{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches \
               -d '{"ref":"main"}'

